<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Account - PromptCanvas AI</title><link rel="icon" href="/assets/logo.svg"><link rel="stylesheet" href="/css/style.css">
</head><body>
<div class="wrap">
  <nav class="nav">
    <a class="brand" href="/"><span class="dot">P</span><span>PromptCanvas<small>AI IMAGE STUDIO</small></span></a>
    <div class="navlinks">
      <a href="/app.html">Dashboard</a><a href="/editor.html">Editor</a><a href="/pricing.html">Pricing</a>
      <button class="btn sm ghost" onclick="signOut()">Sign out</button>
    </div>
  </nav>
  <section class="section" style="padding-top:30px">
    <div class="grid g2" style="align-items:start">
      <div>
        <div class="card" style="margin-bottom:16px">
          <h2 class="big" style="margin-bottom:14px">Subscription</h2>
          <div id="subBox" class="mut">Loading…</div>
          <div class="rowflex" style="margin-top:14px">
            <a class="btn primary sm" href="/pricing.html" id="upgradeBtn">Upgrade / renew</a>
            <span class="mut sm" id="renewNote"></span>
          </div>
        </div>
        <div class="card">
          <h2 class="big" style="margin-bottom:14px">Profile</h2>
          <label>Signed in as</label><input id="pfEmail" disabled>
          <label>New password (leave empty to keep current)</label><input type="password" id="pfPass" placeholder="••••••••">
          <button class="btn sm" style="margin-top:12px" onclick="changePass()">Update password</button>
          <div class="mut sm" id="pfMsg" style="margin-top:10px"></div>
        </div>
      </div>
      <div>
        <div class="card">
          <h2 class="big" style="margin-bottom:14px">Payment history</h2>
          <div style="overflow-x:auto"><table id="txTable"><thead><tr><th>Date</th><th>Plan</th><th>Amount</th><th>Via</th><th>Status</th></tr></thead><tbody></tbody></table></div>
          <p class="mut sm hidden" id="txEmpty" style="margin-top:10px">No payments yet.</p>
        </div>
      </div>
    </div>
  </section>
  <footer>© PromptCanvas AI</footer>
</div>
<div class="toasts" id="toasts"></div>
<script src="/js/api.js"></script><script src="/js/account.js"></script>
</body></html>
