<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign in - PromptCanvas AI</title><link rel="icon" href="/assets/logo.svg"><link rel="stylesheet" href="/css/style.css"><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#08080f"><link rel="apple-touch-icon" href="/assets/icon-192.png">
</head><body>
<div class="wrap"><nav class="nav">
  <a class="brand" href="/"><span class="dot">P</span><span>PromptCanvas<small>AI IMAGE STUDIO</small></span></a>
</nav></div>
<div class="authwrap"><div class="authbox card">
  <div class="tabs"><button id="tLogin" class="on" onclick="showTab('login')">Sign in</button><button id="tSignup" onclick="showTab('signup')">Create account</button></div>
  <div id="loginPane">
    <label>Email</label><input type="email" id="liEmail" autocomplete="email" placeholder="you@example.com">
    <label>Password</label><input type="password" id="liPass" autocomplete="current-password">
    <button class="btn primary" style="width:100%;margin-top:16px" id="btnLogin">Sign in</button>
    <p class="mut sm" style="margin-top:12px;text-align:center"><a href="#" onclick="resetPass();return false" style="color:var(--mut)">Forgot password?</a></p>
  </div>
  <div id="signupPane" class="hidden">
    <label>Email</label><input type="email" id="suEmail" autocomplete="email" placeholder="you@example.com">
    <label>Password (6+ characters)</label><input type="password" id="suPass" autocomplete="new-password">
    <button class="btn primary" style="width:100%;margin-top:16px" id="btnSignup">Create account</button>
    <p class="mut sm" style="margin-top:12px">New accounts start on the Free plan with 2 AI credits daily.</p>
  </div>
  <div id="authMsg" class="mut sm" style="margin-top:14px;text-align:center"></div>
</div></div>
<script src="/js/api.js"></script><script src="/js/auth.js"></script>
</body></html>
